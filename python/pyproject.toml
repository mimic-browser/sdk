[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-browser"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Native Mimic runtime manager and real browser automation integrations"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
playwright = ["playwright==1.63.0"]
pyppeteer = ["pyppeteer==2.0.0"]
test = ["pytest>=8,<10", "websockets>=14,<16"]

[project.scripts]
mimic-sdk = "mimic.runtime:main"

[tool.setuptools.package-data]
mimic = ["runtime-lock.json"]
