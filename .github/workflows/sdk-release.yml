name: Intentional SDK release
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Committed explicit selected-package plan path
        required: true
      runtime:
        description: HTTPS URL of an official Linux runtime archive for qualification
        required: true
      runtime_sha256:
        description: Exact SHA256 of the qualification runtime executable
        required: true
      runtime_archive_sha256:
        description: Exact SHA256 of the qualification archive
        required: true
      publish:
        description: Publish selected qualified packages (requires separately enabled environment)
        type: boolean
        default: false
      resume_run:
        description: Completed release run ID from this exact source commit to resume
        required: false
        default: ""
      verify_pypi_auth:
        description: Verify the PyPI trusted publisher without building or uploading packages
        type: boolean
        default: false
      verify_npm_auth:
        description: Verify the npm trusted publisher without building or uploading packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify-npm-publisher:
    if: inputs.verify_npm_auth
    runs-on: ubuntu-24.04
    environment: sdk-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Verify npm trusted publisher without uploading
        run: python release/npm_oidc.py
  verify-pypi-publisher:
    if: inputs.verify_pypi_auth
    runs-on: ubuntu-24.04
    environment: sdk-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Verify PyPI trusted publisher without uploading
        working-directory: release
        run: |
          python - <<'PY'
          import os
          import pypi_auth
          pypi_auth.publication_environment(os.environ)
          print("PASS PyPI trusted publisher authentication; no package uploaded")
          PY
  selected-packages:
    if: "!inputs.verify_pypi_auth && !inputs.verify_npm_auth"
    runs-on: ubuntu-24.04
    environment: sdk-production
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      PLAN_PATH: ${{ inputs.plan }}
      RESUME_RUN_ID: ${{ inputs.resume_run }}
      RUNTIME_URL: ${{ inputs.runtime }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
      RUNTIME_ARCHIVE_SHA256: ${{ inputs.runtime_archive_sha256 }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate retained release source
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/resume.py source --run-id "$RESUME_RUN_ID"
      - name: Restore immutable release artifacts and receipts
        if: inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: selected-sdk-release-receipts
          path: .build/release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run }}
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22.19.0",
            registry-url: "https://registry.npmjs.org",
          }
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2 --no-audit --no-fund
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.0", cache-dependency-path: go/go.sum }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.94.1" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2.3" }
      - uses: shivammathur/setup-php@v2
        with:
          {
            php-version: "8.3",
            extensions: "curl, openssl, zip, zlib",
            tools: "composer:v2",
          }
      - run: python release/ci.py prepare --plan "$PLAN_PATH"
      - run: python release/release.py validate --plan "$PLAN_PATH"
      - run: python release/resume.py plan --plan "$PLAN_PATH" --output .build/release/plan.json --resume-run "$RESUME_RUN_ID"
      - run: python release/release.py build --plan .build/release/plan.json --output .build/release
      - run: python release/ci.py runtime --url "$RUNTIME_URL" --archive-sha256 "$RUNTIME_ARCHIVE_SHA256" --binary-sha256 "$RUNTIME_SHA256"
      - run: python release/qualify.py --build .build/release/build.json --runtime .build/qualification-runtime/mimic --runtime-sha256 "$RUNTIME_SHA256" --archive .build/default-runtime.tar.gz --output .build/release/qualification.json
      - name: Identify selected publication registries
        id: registries
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        run: |
          python - <<'PY'
          import json, os
          with open('.build/release/build.json') as source:
              selected = {package['registry'] for package in json.load(source)['packages'].values()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for registry in ('nuget', 'rubygems'):
                  print(f"{registry}={str(registry in selected).lower()}", file=output)
          PY
      - name: Authenticate NuGet trusted publisher
        id: nuget-login
        if: steps.registries.outputs.nuget == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: moreveal
      - name: Authenticate RubyGems trusted publisher
        if: steps.registries.outputs.rubygems == 'true'
        uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9
      - name: Provision dedicated Maven signing key
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: python release/ci.py signing-key --build .build/release/build.json
      - name: Verify Maven signature and public key distribution
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        env:
          MIMIC_SDK_PUBLICATION_ENABLED: "true"
          MAVEN_SIGNING_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: python release/maven_signing.py --build .build/release/build.json
      - name: Publish the selected set only
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        env:
          MIMIC_SDK_PUBLICATION_ENABLED: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PHP_MIRROR_SSH_KEY: ${{ secrets.PHP_MIRROR_SSH_KEY }}
        run: python release/publish.py --execute --plan .build/release/plan.json --build .build/release/build.json --qualification .build/release/qualification.json --state .build/release/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-sdk-release-receipts
          path: .build/release
          include-hidden-files: true
