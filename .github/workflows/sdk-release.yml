name: Intentional SDK release
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Committed explicit selected-package plan path
        required: true
      runtime:
        description: HTTPS URL of an official Linux runtime archive for qualification
        required: true
      runtime_sha256:
        description: Exact SHA256 of the qualification runtime executable
        required: true
      runtime_archive_sha256:
        description: Exact SHA256 of the qualification archive
        required: true
      publish:
        description: Publish selected qualified packages (requires separately enabled environment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  selected-packages:
    runs-on: ubuntu-24.04
    environment: sdk-production
    permissions:
      contents: write
      id-token: write
    env:
      PLAN_PATH: ${{ inputs.plan }}
      RUNTIME_URL: ${{ inputs.runtime }}
      RUNTIME_SHA256: ${{ inputs.runtime_sha256 }}
      RUNTIME_ARCHIVE_SHA256: ${{ inputs.runtime_archive_sha256 }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22.19.0",
            registry-url: "https://registry.npmjs.org",
          }
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.6.2 --no-audit --no-fund
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.0", cache-dependency-path: go/go.sum }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: "1.94.1" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2.3" }
      - uses: shivammathur/setup-php@v2
        with:
          {
            php-version: "8.3",
            extensions: "curl, openssl, zip, zlib",
            tools: "composer:v2",
          }
      - run: python release/ci.py prepare --plan "$PLAN_PATH"
      - run: python release/release.py validate --plan "$PLAN_PATH"
      - run: python release/ci.py freeze-plan --plan "$PLAN_PATH" --output .build/release-plan.json
      - run: python release/release.py build --plan .build/release-plan.json --output .build/release
      - run: python release/ci.py runtime --url "$RUNTIME_URL" --archive-sha256 "$RUNTIME_ARCHIVE_SHA256" --binary-sha256 "$RUNTIME_SHA256"
      - run: python release/qualify.py --build .build/release/build.json --runtime .build/qualification-runtime/mimic --runtime-sha256 "$RUNTIME_SHA256" --archive .build/default-runtime.tar.gz --output .build/release/qualification.json
      - name: Provision dedicated Maven signing key
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: python release/ci.py signing-key --build .build/release/build.json
      - name: Publish the selected set only
        if: inputs.publish && vars.SDK_PUBLICATION_ENABLED == 'true'
        env:
          MIMIC_SDK_PUBLICATION_ENABLED: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_TOKEN }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_SIGNING_PASSPHRASE: ${{ secrets.MAVEN_SIGNING_PASSPHRASE }}
          PHP_MIRROR_TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
        run: python release/publish.py --execute --plan .build/release-plan.json --build .build/release/build.json --qualification .build/release/qualification.json --state .build/release/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-sdk-release-receipts
          path: .build/release
