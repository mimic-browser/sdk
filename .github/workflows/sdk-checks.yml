name: SDK source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python generator/generate.py --check
      - run: python -m unittest discover -s generator -p 'test_*.py'
      - run: python -m unittest discover -s release -p 'test_*.py'
  native:
    needs: contract
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [node, python, dotnet, java, go, rust, ruby, php]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.language == 'node'
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26.0'
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
        with:
          toolchain: '1.94.1'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.2.3'
      - uses: shivammathur/setup-php@v2
        if: matrix.language == 'php'
        with:
          php-version: '8.3'
          extensions: curl, openssl, zip, zlib
          tools: composer:v2
      - name: Native offline and transport checks
        env:
          SDK_LANGUAGE: ${{ matrix.language }}
        run: python3 release/ci.py unit "$SDK_LANGUAGE"
